<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arulz-XD - Multi Data Generator</title>
    <style>
        :root {
            --bg-main: #0a0a0f;
            --bg-card: #12131c;
            --text-color: #00ffcc;
            --text-sec: #e0e6ed;
            --cyan-neon: #00f3ff;
            --pink-neon: #ff0055;
            --yellow-neon: #ffe600;
            --border-color: #00f3ff;
            --shadow-color: rgba(0, 243, 255, 0.4);
            --input-bg: #090a0f;
        }

        [data-theme="light"] {
            --bg-main: #f0f3f8;
            --bg-card: #ffffff;
            --text-color: #0d0f18;
            --text-sec: #2a2d3d;
            --cyan-neon: #00a8b3;
            --pink-neon: #d60046;
            --yellow-neon: #d4be00;
            --border-color: #000000;
            --shadow-color: rgba(0, 0, 0, 0.9);
            --input-bg: #f8fafc;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-main);
            color: var(--text-sec);
            margin: 0;
            padding: 20px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 3px solid var(--border-color);
            box-shadow: 6px 6px 0px var(--shadow-color);
            padding: 25px;
            box-sizing: border-box;
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--input-bg);
            padding: 10px 15px;
            border: 2px solid var(--border-color);
        }

        .header-title {
            margin: 0;
            font-size: 20px;
            color: var(--cyan-neon);
            text-shadow: 0 0 5px var(--cyan-neon);
            text-transform: uppercase;
        }

        .theme-toggle {
            background: var(--pink-neon);
            color: #fff;
            border: 2px solid var(--border-color);
            padding: 6px 12px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 2px 2px 0px var(--shadow-color);
        }

        .mode-select-box {
            margin-bottom: 20px;
        }

        select, input[type="text"], input[type="number"], input[type="datetime-local"], textarea {
            width: 100%;
            padding: 12px;
            font-family: inherit;
            font-size: 14px;
            border: 2px solid var(--border-color);
            box-sizing: border-box;
            background: var(--input-bg);
            color: var(--text-sec);
            font-weight: bold;
            outline: none;
            margin-top: 5px;
        }

        select:focus, input:focus, textarea:focus {
            border-color: var(--pink-neon);
            box-shadow: 0 0 8px var(--pink-neon);
        }

        label {
            text-transform: uppercase;
            font-size: 13px;
            color: var(--cyan-neon);
            display: block;
            margin-top: 10px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            background: var(--cyan-neon);
            color: #000;
            border: 2px solid var(--border-color);
            padding: 12px;
            font-size: 14px;
            font-weight: 900;
            font-family: inherit;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--shadow-color);
            transition: 0.1s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--shadow-color);
        }

        .btn.orange {
            background: var(--pink-neon);
            color: #fff;
        }

        .btn.yellow {
            background: var(--yellow-neon);
            color: #000;
        }

        .output-box {
            margin-top: 25px;
            background: #000000;
            color: #00ff66;
            padding: 15px;
            border: 2px solid var(--cyan-neon);
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 13px;
            display: none;
            position: relative;
            max-height: 300px;
            overflow-y: auto;
        }

        .inline-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .inline-group input {
            flex: 1;
        }

        .inline-group button {
            width: auto;
            white-space: nowrap;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h1 class="header-title" id="headerTitle">⚡ ARULZXD GENERATOR</h1>
        <button class="theme-toggle" onclick="toggleTheme()">🌗 MODE TEMA</button>
    </div>

    <!-- Mode Selector pake SELECT tag -->
    <div class="mode-select-box">
        <label for="modeSelector">PILIH MODE GENERATOR:</label>
        <select id="modeSelector" onchange="switchMode(this.value)">
            <option value="voucher">🎟️ Mode Voucher Diskon</option>
            <option value="paste">📋 Mode Pastebin</option>
            <option value="changelog">🚀 Mode Changelog</option>
        </select>
    </div>

    <form id="generatorForm" onsubmit="handleFormSubmit(event)">

        <!-- FIELD VOUCHER -->
        <div class="mode-field" id="field-voucher">
            <div class="form-group">
                <label>Kode Voucher</label>
                <div class="inline-group">
                    <input type="text" id="vCode" placeholder="Masukkan Kode atau Acak...">
                    <button type="button" class="btn yellow" onclick="generateRandomVoucher()">🎲 Acak</button>
                </div>
            </div>

            <div class="form-group">
                <label for="vDiscount">Nominal / Persentase Diskon</label>
                <input type="number" id="vDiscount" placeholder="Contoh: 20 (untuk 20% atau Rp 20.000)" required>
            </div>

            <div class="form-group">
                <label for="vType">Tipe Diskon</label>
                <select id="vType">
                    <option value="percentage">Persentase (%)</option>
                    <option value="fixed">Potongan Tetap (Nominal)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="vExpiry">Tanggal & Waktu Expired</label>
                <input type="datetime-local" id="vExpiry" required>
            </div>

            <div class="form-group">
                <label for="vLimit">Batas Penggunaan (Max Use)</label>
                <input type="number" id="vLimit" value="100" placeholder="100">
            </div>
        </div>

        <!-- FIELD PASTEBIN -->
        <div class="mode-field" id="field-paste" style="display: none;">
            <div class="form-group">
                <label for="title">Judul Snippet</label>
                <input type="text" id="title" placeholder="Contoh: Script Auto Login">
            </div>
            <div class="form-group">
                <label for="language">Bahasa Pemrograman</label>
                <select id="language">
                    <option value="javascript">JavaScript</option>
                    <option value="html">HTML</option>
                    <option value="php">PHP</option>
                    <option value="python">Python</option>
                    <option value="plaintext">Plaintext</option>
                </select>
            </div>
            <div class="form-group">
                <label for="content">Isi Kode</label>
                <textarea id="content" placeholder="Tempelkan kode di sini..."></textarea>
            </div>
        </div>

        <!-- FIELD CHANGELOG -->
        <div class="mode-field" id="field-changelog" style="display: none;">
            <div class="form-group">
                <label for="version">Versi</label>
                <input type="text" id="version" value="v1.0.0">
            </div>
            <div class="form-group">
                <label for="type">Tipe Perubahan</label>
                <select id="type">
                    <option value="feature">Feature</option>
                    <option value="bugfix">Bugfix</option>
                    <option value="update">Update</option>
                </select>
            </div>
            <div class="form-group">
                <label for="clTitle">Judul Log</label>
                <input type="text" id="clTitle" placeholder="Detail update...">
            </div>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn">⚡ EXECUTE / SIMPAN</button>
            <button type="button" class="btn orange" onclick="resetForm()">🧹 RESET</button>
        </div>
    </form>

    <div class="output-box" id="outputContainer">
        <code id="jsonOutput"></code>
    </div>
</div>

<script>
    let currentMode = 'voucher';

    // Theme Switcher
    function toggleTheme() {
        const html = document.documentElement;
        const current = html.getAttribute('data-theme');
        const target = current === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', target);
    }

    // Switch Form Mode
    function switchMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-field').forEach(el => el.style.display = 'none');
        document.getElementById(`field-${mode}`).style.display = 'block';
        document.getElementById('outputContainer').style.display = 'none';
    }

    // Generator Kode Voucher Acak (ARULZXD tanpa -)
    function generateRandomVoucher() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let randomStr = '';
        for (let i = 0; i < 6; i++) {
            randomStr += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        // Format: ARULZXD + String Acak
        document.getElementById('vCode').value = `ARULZXD${randomStr}`;
    }

    // Handle Form Submit
    async function handleFormSubmit(e) {
        e.preventDefault();
        let payload = {};

        if (currentMode === 'voucher') {
            const code = document.getElementById('vCode').value || `ARULZXD${Math.random().toString(36).substring(2, 8).toUpperCase()}`;
            payload = {
                code: code,
                discount: Number(document.getElementById('vDiscount').value),
                type: document.getElementById('vType').value,
                expiredAt: document.getElementById('vExpiry').value,
                usageLimit: Number(document.getElementById('vLimit').value)
            };

            // Kirim ke Backend MongoDB API
            try {
                const response = await fetch('/api/vouchers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                showOutput({ status: 'SUCCESS_SAVED_TO_MONGODB', data: result });
            } catch (err) {
                showOutput({ status: 'LOCAL_JSON_ONLY (SERVER OFFLINE)', data: payload });
            }

        } else if (currentMode === 'paste') {
            payload = {
                id: Date.now(),
                title: document.getElementById('title').value,
                language: document.getElementById('language').value,
                content: document.getElementById('content').value
            };
            showOutput(payload);
        } else if (currentMode === 'changelog') {
            payload = {
                version: document.getElementById('version').value,
                type: document.getElementById('type').value,
                title: document.getElementById('clTitle').value,
                date: new Date().toISOString()
            };
            showOutput(payload);
        }
    }

    function showOutput(data) {
        const out = document.getElementById('outputContainer');
        document.getElementById('jsonOutput').textContent = JSON.stringify(data, null, 4);
        out.style.display = 'block';
    }

    function resetForm() {
        document.getElementById('generatorForm').reset();
        document.getElementById('outputContainer').style.display = 'none';
    }
</script>
</body>
</html>
